name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Same official images as Docker Hub's postgres:15 / redis:7 (identical digests), pulled
      # from Google's Docker Hub mirror: runners were timing out on auth.docker.io
      postgres:
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: investiq
          POSTGRES_PASSWORD: investiq
          POSTGRES_DB: investiq
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Variable names per Architecture.md §17; CI-only placeholder values
    env:
      DATABASE_URL: postgresql://investiq:investiq@127.0.0.1:5435/investiq
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: ./services/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Apply DB migrations
        run: alembic upgrade head

      - name: Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier, all workspaces)
        run: npm run lint

      - name: i18n parity (en.json vs ur.json keys, empty values, placeholders)
        run: |
          npm test -w @investiq/i18n
          npm run check -w @investiq/i18n

      - name: Type-check web
        working-directory: ./apps/web
        run: npx tsc -b

      - name: Unit tests (web, Node built-in test runner)
        working-directory: ./apps/web
        run: npm test

      - name: Unit tests (api-client token refresh, Node built-in test runner)
        run: npm test -w @investiq/api-client

      - name: Type-check mobile
        working-directory: ./apps/mobile
        run: npx tsc --noEmit

      - name: Type-check shared packages
        run: |
          for pkg in shared-types api-client i18n design-tokens; do
            npx tsc --noEmit -p packages/$pkg
          done
