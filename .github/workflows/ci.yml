name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black & Ruff
        working-directory: ./services/api
        run: |
          black --check .
          ruff check .

      - name: Run Pytest
        working-directory: ./services/api
        run: |
          python -m pytest

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run frontend type-check (web)
        working-directory: ./apps/web
        run: npm run build

      - name: Run frontend type-check (mobile)
        working-directory: ./apps/mobile
        run: npx tsc --noEmit
