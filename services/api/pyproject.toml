[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '(venv|alembic/versions)'

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
# B008: FastAPI's `Depends(...)` in argument defaults is the framework's intended pattern
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's formatting
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "crud", "integrations", "ml", "models", "routers", "schemas", "services", "worker", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
