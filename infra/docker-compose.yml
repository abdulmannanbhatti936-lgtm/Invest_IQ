version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investiq}
      POSTGRES_DB: ${POSTGRES_DB:-investiq}
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
